name: Validate native build cleanup
on:
  push:
    branches:
      - validation/windows-cleanup-91-2026-10-29
permissions:
  contents: read
jobs:
  verify:
    name: Linux ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, patched]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply proposed cleanup commands
        if: matrix.variant == 'patched'
        shell: python
        run: |
          import base64, hashlib
          from pathlib import Path
          entries = {'packages/schema/package.json': '', 'packages/renderer/package.json': '', 'packages/cli/package.json': ''}
          for path, content in entries.items():
              raw = base64.b64decode(content)
              Path(path).write_bytes(raw)
              print(path, hashlib.sha256(raw).hexdigest())
      - name: Check diff and seed stale artifacts
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          subprocess.run(['git', 'diff', '--check'], check=True)
          for name in ['schema', 'renderer', 'cli']:
              dist = Path('packages') / name / 'dist'
              for rel in ['stale artifact.txt', 'stale-nested/old.js']:
                  target = dist / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text('old artifact', encoding='utf-8')
      - run: pnpm verify
      - name: Verify stale artifacts removed and entry points rebuilt
        shell: python
        run: |
          from pathlib import Path
          for name in ['schema', 'renderer', 'cli']:
              dist = Path('packages') / name / 'dist'
              for rel in ['stale artifact.txt', 'stale-nested/old.js']:
                  assert not (dist / rel).exists(), str(dist / rel)
              entry = 'bin.js' if name == 'cli' else 'index.js'
              assert (dist / entry).is_file(), str(dist / entry)
          print('PASS: six stale artifacts removed and compiled entry points recreated')
