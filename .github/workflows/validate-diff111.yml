name: Verify Unicode diff paths (issue 111)
on:
  push:
    branches:
      - validation/cli-unicode-diff-paths-111-2026-11-14
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, patched]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Apply verified patch bytes
        if: matrix.variant == 'patched'
        shell: python
        run: |
          import base64
          import hashlib
          from pathlib import Path
          for path, encoded in {'packages/cli/src/git.ts': '', 'packages/cli/test/git.test.ts': ''}.items():
              raw = base64.b64decode(encoded)
              Path(path).write_bytes(raw)
              print(path, hashlib.sha256(raw).hexdigest())
      - run: git diff --check
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm verify
