name: Validate render title paths
on:
  push:
    branches:
      - validation/chinese-render-slug-96-2026-11-04
permissions:
  contents: read
jobs:
  verify:
    name: Linux ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, patched]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Apply verified candidate files
        if: matrix.variant == 'patched'
        shell: python
        run: |
          import base64, hashlib
          from pathlib import Path
          entries = {'packages/cli/package.json': '', 'packages/cli/src/commands/render.ts': '', 'packages/cli/src/slug.ts': '', 'packages/cli/test/render-title.test.ts': '', 'pnpm-lock.yaml': ''}
          for path, content in entries.items():
              raw = base64.b64decode(content)
              Path(path).write_bytes(raw)
              print(path, hashlib.sha256(raw).hexdigest())
      - run: git diff --check
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm verify
